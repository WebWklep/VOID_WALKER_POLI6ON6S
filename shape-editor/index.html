<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;color:#ddd;font-family:Arial,Helvetica,sans-serif}

<body><div id="app">
<section class="view"><canvas id="scene"></canvas><div class="brand">FORM / CREATURE LAB · BUILD STRANGE THINGS</div><div class="count" id="count">01 OBJECT</div><div id="rasterOverlay"></div><input id="orbitY" type="range" min="-180" max="180" value="35" aria-label="Вращение по вертикальной оси"><input id="orbitX" type="range" min="-75" max="75" value="18" aria-label="Вращение по горизонтальной оси"></section>
<section class="tools">

<button class="category active" data-category="HEAD">HEAD</button><button class="category" data-category="BODY">BODY</button><button class="category" data-category="ARMS">ARMS</button><button class="category" data-category="LEGS">LEGS</button><button class="category" data-category="EXTRAS">EXTRAS</button>
</div>

<div class="tool"><button id="rotate" aria-label="Поворот">⟳</button><div class="label">ROTATE</div></div>

<button data-move="-1,0,0" aria-label="Влево">←</button>

<button data-move="1,0,0" aria-label="Вправо">→</button>

</div><div class="label">XYZ / MOVE</div></div>

<div class="tool"><button id="reset" class="small" aria-label="Сброс камеры">◎</button><div class="label">CENTER</div></div><div class="tool" id="rasterPanel"><button id="raster" aria-label="Растровая заливка">▦</button><input id="rasterLevel" type="range" min="5" max="45" value="18" aria-label="Плотность растра"><div class="label">RASTER</div></div>
</div><div id="status">SELECT SHAPE · CREATE IN CENTER</div>
</section></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const canvas=document.querySelector('#scene');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setClearColor(0x050505);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x050505);
const camera=new THREE.PerspectiveCamera(42,1,.1,100);
let yaw=35*Math.PI/180,pitch=18*Math.PI/180,target=new THREE.Vector3();
const objects=[];const history=[];let currentCategory='HEAD',mirrorMode=false,skinMode=0;let restoring=false;function checkpoint(){if(restoring)return;history.push({items:objects.map(o=>({type:o.userData.type,pos:o.position.toArray(),rot:o.rotation.toArray(),scale:o.scale.toArray()})),selected:objects.indexOf(selected)});if(history.length>60)history.shift();}function undo(){const h=history.pop();if(!h)return;restoring=true;for(const o of [...objects])scene.remove(o);objects.length=0;for(const d of h.items){const o=new THREE.LineSegments(new THREE.EdgesGeometry(geometry(d.type)),lineMat);o.userData.type=d.type;o.position.fromArray(d.pos);o.rotation.fromArray(d.rot);o.scale.fromArray(d.scale);scene.add(o);objects.push(o);}selected=null;select(objects[h.selected]||objects.at(-1)||null);updateCount();restoring=false;}let selected=null,lastSelected=null,magnetArmed=false,autoMagnet=false,rotateMode=false,scaleMode=false;
const lineMat=new THREE.LineBasicMaterial({color:0xbdbdbd,transparent:true,opacity:.82});const contactMat=new THREE.LineBasicMaterial({color:0xbfd9c4,transparent:true,opacity:.9});
const selectedMat=new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:1});
function geometry(type){
if(type==='box'||type==='head_cube'||type==='body_block'||type==='hand_block'||type==='foot_block'||type==='armor')return new THREE.BoxGeometry(1,1,1);
if(type==='sphere'||type==='head_orb'||type==='eye')return new THREE.SphereGeometry(.58,10,8);
if(type==='head_long')return new THREE.BoxGeometry(.72,1.15,.72);
if(type==='head_mask')return new THREE.CylinderGeometry(.52,.38,.82,6,1);
if(type==='body_core')return new THREE.CylinderGeometry(.42,.62,1.35,6,1);
if(type==='body_tall')return new THREE.BoxGeometry(.8,1.45,.55);
if(type==='limb')return new THREE.CylinderGeometry(.22,.3,1.15,6,1);
if(type==='claw')return new THREE.ConeGeometry(.32,.85,5);
if(type==='leg_heavy')return new THREE.BoxGeometry(.48,1.25,.65);
if(type==='antenna')return new THREE.CylinderGeometry(.045,.07,.9,5);
if(type==='horn')return new THREE.ConeGeometry(.2,.75,5);
if(type==='cylinder')return new THREE.CylinderGeometry(.48,.48,1.15,8,1);
return new THREE.PlaneGeometry(1.35,1.35,1,1);
}
function dims(o){const b=new THREE.Box3().setFromObject(o);const v=new THREE.Vector3();b.getSize(v);return v;}
function make(type){checkpoint();const edges=new THREE.EdgesGeometry(geometry(type));const mesh=new THREE.LineSegments(edges,lineMat);mesh.userData.type=type;mesh.position.set(0,0,0);scene.add(mesh);objects.push(mesh);select(mesh);document.querySelector('#status').textContent=type.toUpperCase()+' CREATED';updateCount();}
function select(o){if(selected)selected.material=lineMat;lastSelected=selected;selected=o;if(selected)selected.material=selectedMat;document.querySelector('#status').textContent=o?'SELECTED · '+o.userData.type.toUpperCase():'NO SELECTION';}
function updateContacts(){for(const o of objects){let touching=false;const a=new THREE.Box3().setFromObject(o);for(const p of objects){if(p===o)continue;const b=new THREE.Box3().setFromObject(p),e=.025;const overlapX=Math.min(a.max.x,b.max.x)-Math.max(a.min.x,b.min.x),overlapY=Math.min(a.max.y,b.max.y)-Math.max(a.min.y,b.min.y),overlapZ=Math.min(a.max.z,b.max.z)-Math.max(a.min.z,b.min.z);const face=(Math.abs(a.max.x-b.min.x)<e||Math.abs(b.max.x-a.min.x)<e)&&overlapY>0&&overlapZ>0||(Math.abs(a.max.y-b.min.y)<e||Math.abs(b.max.y-a.min.y)<e)&&overlapX>0&&overlapZ>0||(Math.abs(a.max.z-b.min.z)<e||Math.abs(b.max.z-a.min.z)<e)&&overlapX>0&&overlapY>0;if(face){touching=true;break;}}o.material=(o===selected?selectedMat:touching?contactMat:lineMat);}}function updateCount(){document.querySelector('#count').textContent=String(objects.length).padStart(2,'0')+' OBJECT'+(objects.length===1?'':'S');}
function intersects(a,b){const A=new THREE.Box3().setFromObject(a),B=new THREE.Box3().setFromObject(b);return A.intersectsBox(B);}
function attachTo(targetObj,moving){if(!targetObj||!moving||targetObj===moving)return;checkpoint();const a=new THREE.Box3().setFromObject(targetObj),b=new THREE.Box3().setFromObject(moving);const ac=a.getCenter(new THREE.Vector3()),bc=b.getCenter(new THREE.Vector3());const delta=bc.sub(ac);let axis='x';if(Math.abs(delta.y)>Math.abs(delta.x)&&Math.abs(delta.y)>Math.abs(delta.z))axis='y';else if(Math.abs(delta.z)>Math.abs(delta.x))axis='z';const gap=.015;const pos=targetObj.position.clone();const da=dims(targetObj),db=dims(moving);const sign=delta[axis]>=0?1:-1;pos[axis]+=sign*(da[axis]+db[axis])/2+sign*gap;moving.position.copy(pos);document.querySelector('#status').textContent='MAGNETICALLY ALIGNED';}

const catalog={
HEAD:[['BLOCK','head_cube',[.85,.8,.8]],['ORB','head_orb',[.9,.9,.9]],['MASK','head_mask',[1,1,1]],['LONG','head_long',[1,1,1]]],
BODY:[['CORE','body_core',[1,1,1]],['TALL','body_tall',[1,1,1]],['BLOCK','body_block',[1,1,1]],['ARMOR','armor',[1.15,1.1,.8]]],
ARMS:[['LIMB','limb',[1,1,1]],['CLAW','claw',[1,1,1]],['HAND','hand_block',[.5,.45,.5]]],
LEGS:[['HEAVY','leg_heavy',[1,1,1]],['JOINT','limb',[.85,.85,.85]],['FOOT','foot_block',[.8,.38,1.1]]],
EXTRAS:[['EYE','eye',[.28,.28,.28]],['ANTENNA','antenna',[1,1,1]],['HORN','horn',[1,1,1]]]
};
function renderParts(){const root=document.querySelector('#parts');root.innerHTML='';catalog[currentCategory].forEach(([name,type,sc])=>{const b=document.createElement('button');b.className='part';b.innerHTML='<span>◇</span>'+name;b.onclick=()=>addPart(type,sc,name);root.appendChild(b);});}
function addPart(type,sc,name){
checkpoint();const o=new THREE.LineSegments(new THREE.EdgesGeometry(geometry(type)),lineMat);o.userData.type=type;o.userData.part=name;o.scale.set(...sc);
const base=selected||objects.find(x=>x.userData.part==='CORE'||x.userData.type==='body_core');
if(base){const offset={HEAD:[0,.95,0],BODY:[0,0,0],ARMS:[.78,.25,0],LEGS:[.32,-1,0],EXTRAS:[0,.65,.45]}[currentCategory]||[0,0,0];o.position.copy(base.position).add(new THREE.Vector3(...offset));}
else o.position.set(0,0,0);
scene.add(o);objects.push(o);select(o);updateCount();
if(mirrorMode&&(currentCategory==='ARMS'||currentCategory==='LEGS')){const m=new THREE.LineSegments(new THREE.EdgesGeometry(geometry(type)),lineMat);m.userData.type=type;m.userData.part=name+' / MIRROR';m.scale.copy(o.scale);m.position.copy(o.position);m.position.x*=-1;scene.add(m);objects.push(m);updateCount();}
document.querySelector('#status').textContent=name+' ADDED';
}
document.querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>{currentCategory=b.dataset.category;document.querySelectorAll('[data-category]').forEach(x=>x.classList.toggle('active',x===b));renderParts();});
document.querySelector('#mirror').onclick=()=>{mirrorMode=!mirrorMode;document.querySelector('#mirror').classList.toggle('active',mirrorMode);document.querySelector('#status').textContent=mirrorMode?'MIRROR BUILD ON':'MIRROR BUILD OFF';};
document.querySelector('#skin').onclick=()=>{skinMode=(skinMode+1)%3;const labels=['GRAPHITE','GRAIN','RASTER'];document.querySelector('#skin').textContent='◈ SKIN: '+labels[skinMode];document.querySelector('.view').classList.toggle('raster',skinMode===2);document.querySelector('#rasterOverlay').style.opacity=skinMode===1?'.22':'';};
document.querySelector('#random').onclick=()=>{checkpoint();const choices=[['body_core',[1,1,1]],['head_mask',[1,1,1]],['limb',[1,1,1]],['leg_heavy',[1,1,1]],['horn',[.7,.7,.7]]];const body=new THREE.LineSegments(new THREE.EdgesGeometry(geometry('body_core')),lineMat);body.userData.type='body_core';body.userData.part='CORE';scene.add(body);objects.push(body);const add=(type,sc,pos)=>{const o=new THREE.LineSegments(new THREE.EdgesGeometry(geometry(type)),lineMat);o.userData.type=type;o.scale.set(...sc);o.position.set(...pos);scene.add(o);objects.push(o);};add('head_mask',[1,1,1],[0,1,0]);add('limb',[1,1,1],[-.8,.2,0]);add('limb',[1,1,1],[.8,.2,0]);add('leg_heavy',[1,1,1],[-.3,-1,0]);add('leg_heavy',[1,1,1],[.3,-1,0]);select(body);updateCount();document.querySelector('#status').textContent='UNEXPECTED CREATURE GENERATED';};
renderParts();
document.querySelector('#magnet').onclick=()=>{magnetArmed=!magnetArmed;document.querySelector('#magnet').classList.toggle('active',magnetArmed);document.querySelector('#status').textContent=magnetArmed?'MAGNET: SELECT TARGET':'MAGNET OFF';};
document.querySelector('#snap').onclick=()=>{autoMagnet=!autoMagnet;document.querySelector('#snap').classList.toggle('active',autoMagnet);document.querySelector('#status').textContent=autoMagnet?'AUTO MAGNET ON':'AUTO MAGNET OFF';};
document.querySelector('#rotate').onclick=()=>{rotateMode=!rotateMode;scaleMode=false;document.querySelector('#rotate').classList.toggle('active',rotateMode);document.querySelector('#scale').classList.remove('active');};
document.querySelector('#scale').onclick=()=>{scaleMode=!scaleMode;rotateMode=false;document.querySelector('#scale').classList.toggle('active',scaleMode);document.querySelector('#rotate').classList.remove('active');};
document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{if(!selected)return;checkpoint();const v=b.dataset.move.split(',').map(Number);const step=.1;selected.position.add(new THREE.Vector3(...v).multiplyScalar(step));if(autoMagnet)keepClear(selected);});
function keepClear(o){for(const other of objects){if(other===o)continue;if(intersects(o,other)){const d=dims(other),e=dims(o);const diff=o.position.clone().sub(other.position);let ax='x';if(Math.abs(diff.y)>Math.abs(diff.x)&&Math.abs(diff.y)>Math.abs(diff.z))ax='y';else if(Math.abs(diff.z)>Math.abs(diff.x))ax='z';o.position[ax]=other.position[ax]+(diff[ax]>=0?1:-1)*(d[ax]+e[ax])/2+.02;}}}
document.querySelector('#delete').onclick=()=>{if(!selected)return;checkpoint();scene.remove(selected);objects.splice(objects.indexOf(selected),1);selected=null;updateCount();select(objects.at(-1)||null);};
document.querySelector('#reset').onclick=()=>{yaw=35*Math.PI/180;pitch=18*Math.PI/180;target.set(0,0,0);document.querySelector('#orbitY').value=35;document.querySelector('#orbitX').value=18;};
document.querySelector('#orbitY').oninput=e=>yaw=Number(e.target.value)*Math.PI/180;
document.querySelector('#orbitX').oninput=e=>pitch=Number(e.target.value)*Math.PI/180;
const ray=new THREE.Raycaster(),pointer=new THREE.Vector2();
canvas.addEventListener('pointerdown',e=>{const r=canvas.getBoundingClientRect();pointer.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);ray.setFromCamera(pointer,camera);const hits=ray.intersectObjects(objects);if(!hits.length)return;const hit=hits[0].object;if(magnetArmed){attachTo(hit,selected);magnetArmed=false;document.querySelector('#magnet').classList.remove('active');}else if(hit===selected&&rotateMode){checkpoint();selected.rotation.y+=Math.PI/8;}else if(hit===selected&&scaleMode){checkpoint();selected.scale.multiplyScalar(1.12);}else select(hit);});
function resize(){const r=canvas.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix();}new ResizeObserver(resize).observe(canvas);resize();
document.querySelector('#undo').onclick=undo;document.querySelector('#raster').onclick=()=>{document.querySelector('.view').classList.toggle('raster');document.querySelector('#raster').classList.toggle('active');};document.querySelector('#rasterLevel').oninput=e=>document.querySelector('.view').style.setProperty('--raster-opacity',Number(e.target.value)/100);
function frame(){requestAnimationFrame(frame);updateContacts();const radius=7;camera.position.set(target.x+Math.sin(yaw)*Math.cos(pitch)*radius,target.y+Math.sin(pitch)*radius,target.z+Math.cos(yaw)*Math.cos(pitch)*radius);camera.lookAt(target);renderer.render(scene,camera);}frame();
// Start with an empty creature stage.
</script></body></html>
