<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>FORM / 001</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;color:#ddd;font-family:Arial,Helvetica,sans-serif}
#app{height:100dvh;display:flex;flex-direction:column}.view{height:60%;min-height:0;position:relative;background:#050505;border-bottom:1px solid #292929}
canvas{display:block;width:100%;height:100%;touch-action:none}
.brand{position:absolute;top:15px;left:17px;font:10px monospace;letter-spacing:.22em;color:#777}.count{position:absolute;right:17px;top:15px;font:10px monospace;color:#666}
#orbitY{position:absolute;bottom:12px;left:15%;width:70%;accent-color:#ddd;height:18px}#orbitX{position:absolute;right:8px;top:22%;height:55%;writing-mode:vertical-lr;direction:rtl;accent-color:#ddd;width:18px}
.tools{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-evenly;padding:8px 18px 12px;gap:5px}
.row{display:flex;align-items:center;justify-content:center;gap:clamp(8px,3vw,22px)}button{background:none;color:#aaa;border:1px solid #393939;border-radius:0;min-width:46px;height:42px;font-size:20px;display:grid;place-items:center;cursor:pointer;touch-action:manipulation}
button:active,button.active{border-color:#eee;color:#fff;background:#171717}.shape{font-size:23px}.label{font:9px monospace;letter-spacing:.12em;color:#686868;text-align:center;margin-top:4px}
.tool{display:flex;flex-direction:column;align-items:center}.tool button{width:48px}
#pad{display:grid;grid-template-columns:repeat(3,34px);grid-template-rows:repeat(3,30px);gap:2px}#pad button{min-width:0;width:34px;height:30px;font-size:14px}
#pad .empty{visibility:hidden}.small{font-size:15px}
#rasterPanel{display:flex;align-items:center;gap:8px}#rasterLevel{width:76px;accent-color:#ddd;height:18px}#rasterOverlay{position:absolute;inset:0;pointer-events:none;opacity:0;mix-blend-mode:screen;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(220,220,220,.12) 3px 4px),repeating-linear-gradient(90deg,transparent 0 3px,rgba(220,220,220,.08) 3px 4px)}.view.raster #rasterOverlay{opacity:var(--raster-opacity,.18)}#status{font:9px monospace;letter-spacing:.12em;color:#666;text-align:center;min-height:12px}
@media(max-height:650px){.view{height:57%}.tools{padding:3px 12px}.row{gap:8px}button{height:36px;min-width:40px}.tool button{width:42px}}
</style></head>
<body><div id="app">
<section class="view"><canvas id="scene"></canvas><div class="brand">FORM / SPATIAL OBJECT EDITOR</div><div class="count" id="count">01 OBJECT</div><div id="rasterOverlay"></div><input id="orbitY" type="range" min="-180" max="180" value="35" aria-label="Вращение по вертикальной оси"><input id="orbitX" type="range" min="-75" max="75" value="18" aria-label="Вращение по горизонтальной оси"></section>
<section class="tools">
<div class="row" id="shapes">
<div class="tool"><button class="shape" data-shape="box" aria-label="Куб">□</button><div class="label">CUBE</div></div>
<div class="tool"><button class="shape" data-shape="sphere" aria-label="Шар">○</button><div class="label">SPHERE</div></div>
<div class="tool"><button class="shape" data-shape="cylinder" aria-label="Цилиндр">⬭</button><div class="label">CYLINDER</div></div>
<div class="tool"><button class="shape" data-shape="plane" aria-label="Плоскость">▱</button><div class="label">PLANE</div></div>
</div>
<div class="row">
<div class="tool"><button id="magnet" aria-label="Магнит">⌁</button><div class="label">MAGNET</div></div>
<div class="tool"><button id="snap" aria-label="Постоянный магнит">⊛</button><div class="label">AUTO</div></div>
<div class="tool"><button id="rotate" aria-label="Поворот">⟳</button><div class="label">ROTATE</div></div>
<div class="tool"><button id="scale" aria-label="Размер">↗</button><div class="label">SIZE</div></div>
</div>
<div class="row">
<div class="tool"><div id="pad">
<button class="empty"></button><button data-move="0,0,-1">↑</button><button class="empty"></button>
<button data-move="-1,0,0">←</button><button data-move="0,1,0">＋</button><button data-move="1,0,0">→</button>
<button class="empty"></button><button data-move="0,0,1">↓</button><button class="empty"></button>
</div><div class="label">AXIS / MOVE</div></div>
<div class="tool"><button id="undo" class="small" aria-label="Назад">↶</button><div class="label">UNDO</div></div><div class="tool"><button id="delete" class="small" aria-label="Удалить">×</button><div class="label">DELETE</div></div>
<div class="tool"><button id="reset" class="small" aria-label="Сброс камеры">◎</button><div class="label">CENTER</div></div><div class="tool" id="rasterPanel"><button id="raster" aria-label="Растровая заливка">▦</button><input id="rasterLevel" type="range" min="5" max="45" value="18" aria-label="Плотность растра"><div class="label">RASTER</div></div>
</div><div id="status">SELECT SHAPE · CREATE IN CENTER</div>
</section></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const canvas=document.querySelector('#scene');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setClearColor(0x050505);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x050505);
const camera=new THREE.PerspectiveCamera(42,1,.1,100);
let yaw=35*Math.PI/180,pitch=18*Math.PI/180,target=new THREE.Vector3();
const objects=[];const history=[];let restoring=false;function checkpoint(){if(restoring)return;history.push({items:objects.map(o=>({type:o.userData.type,pos:o.position.toArray(),rot:o.rotation.toArray(),scale:o.scale.toArray()})),selected:objects.indexOf(selected)});if(history.length>60)history.shift();}function undo(){const h=history.pop();if(!h)return;restoring=true;for(const o of [...objects])scene.remove(o);objects.length=0;for(const d of h.items){const o=new THREE.LineSegments(new THREE.EdgesGeometry(geometry(d.type)),lineMat.clone());o.userData.type=d.type;o.position.fromArray(d.pos);o.rotation.fromArray(d.rot);o.scale.fromArray(d.scale);scene.add(o);objects.push(o);}selected=null;select(objects[h.selected]||objects.at(-1)||null);updateCount();restoring=false;}let selected=null,lastSelected=null,magnetArmed=false,autoMagnet=false,rotateMode=false,scaleMode=false;
const lineMat=new THREE.LineBasicMaterial({color:0xbdbdbd,transparent:true,opacity:.82});const contactMat=new THREE.LineBasicMaterial({color:0xbfd9c4,transparent:true,opacity:.9});
const selectedMat=new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:1});
function geometry(type){if(type==='box')return new THREE.BoxGeometry(1,1,1);if(type==='sphere')return new THREE.SphereGeometry(.58,16,12);if(type==='cylinder')return new THREE.CylinderGeometry(.48,.48,1.15,16,1);return new THREE.PlaneGeometry(1.35,1.35,1,1);}
function dims(o){const b=new THREE.Box3().setFromObject(o);const v=new THREE.Vector3();b.getSize(v);return v;}
function make(type){checkpoint();const edges=new THREE.EdgesGeometry(geometry(type));const mesh=new THREE.LineSegments(edges,lineMat.clone());mesh.userData.type=type;mesh.position.set(0,0,0);scene.add(mesh);objects.push(mesh);select(mesh);document.querySelector('#status').textContent=type.toUpperCase()+' CREATED';updateCount();}
function select(o){if(selected)selected.material= lineMat.clone();lastSelected=selected;selected=o;if(selected)selected.material=selectedMat.clone();document.querySelector('#status').textContent=o?'SELECTED · '+o.userData.type.toUpperCase():'NO SELECTION';}
function updateContacts(){for(const o of objects){let touching=false;const a=new THREE.Box3().setFromObject(o);for(const p of objects){if(p===o)continue;const b=new THREE.Box3().setFromObject(p),e=.025;const overlapX=Math.min(a.max.x,b.max.x)-Math.max(a.min.x,b.min.x),overlapY=Math.min(a.max.y,b.max.y)-Math.max(a.min.y,b.min.y),overlapZ=Math.min(a.max.z,b.max.z)-Math.max(a.min.z,b.min.z);const face=(Math.abs(a.max.x-b.min.x)<e||Math.abs(b.max.x-a.min.x)<e)&&overlapY>0&&overlapZ>0||(Math.abs(a.max.y-b.min.y)<e||Math.abs(b.max.y-a.min.y)<e)&&overlapX>0&&overlapZ>0||(Math.abs(a.max.z-b.min.z)<e||Math.abs(b.max.z-a.min.z)<e)&&overlapX>0&&overlapY>0;if(face){touching=true;break;}}o.material=(o===selected?selectedMat:touching?contactMat:lineMat).clone();}}function updateCount(){document.querySelector('#count').textContent=String(objects.length).padStart(2,'0')+' OBJECT'+(objects.length===1?'':'S');}
function intersects(a,b){const A=new THREE.Box3().setFromObject(a),B=new THREE.Box3().setFromObject(b);return A.intersectsBox(B);}
function attachTo(targetObj,moving){if(!targetObj||!moving||targetObj===moving)return;checkpoint();const a=new THREE.Box3().setFromObject(targetObj),b=new THREE.Box3().setFromObject(moving);const ac=a.getCenter(new THREE.Vector3()),bc=b.getCenter(new THREE.Vector3());const delta=bc.sub(ac);let axis='x';if(Math.abs(delta.y)>Math.abs(delta.x)&&Math.abs(delta.y)>Math.abs(delta.z))axis='y';else if(Math.abs(delta.z)>Math.abs(delta.x))axis='z';const gap=.015;const pos=targetObj.position.clone();const da=dims(targetObj),db=dims(moving);const sign=delta[axis]>=0?1:-1;pos[axis]+=sign*(da[axis]+db[axis])/2+sign*gap;moving.position.copy(pos);document.querySelector('#status').textContent='MAGNETICALLY ALIGNED';}
document.querySelectorAll('[data-shape]').forEach(b=>b.onclick=()=>make(b.dataset.shape));
document.querySelector('#magnet').onclick=()=>{magnetArmed=!magnetArmed;document.querySelector('#magnet').classList.toggle('active',magnetArmed);document.querySelector('#status').textContent=magnetArmed?'MAGNET: SELECT TARGET':'MAGNET OFF';};
document.querySelector('#snap').onclick=()=>{autoMagnet=!autoMagnet;document.querySelector('#snap').classList.toggle('active',autoMagnet);document.querySelector('#status').textContent=autoMagnet?'AUTO MAGNET ON':'AUTO MAGNET OFF';};
document.querySelector('#rotate').onclick=()=>{rotateMode=!rotateMode;scaleMode=false;document.querySelector('#rotate').classList.toggle('active',rotateMode);document.querySelector('#scale').classList.remove('active');};
document.querySelector('#scale').onclick=()=>{scaleMode=!scaleMode;rotateMode=false;document.querySelector('#scale').classList.toggle('active',scaleMode);document.querySelector('#rotate').classList.remove('active');};
document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{if(!selected)return;checkpoint();const v=b.dataset.move.split(',').map(Number);const step=.1;selected.position.add(new THREE.Vector3(...v).multiplyScalar(step));if(autoMagnet)keepClear(selected);});
function keepClear(o){for(const other of objects){if(other===o)continue;if(intersects(o,other)){const d=dims(other),e=dims(o);const diff=o.position.clone().sub(other.position);let ax='x';if(Math.abs(diff.y)>Math.abs(diff.x)&&Math.abs(diff.y)>Math.abs(diff.z))ax='y';else if(Math.abs(diff.z)>Math.abs(diff.x))ax='z';o.position[ax]=other.position[ax]+(diff[ax]>=0?1:-1)*(d[ax]+e[ax])/2+.02;}}}
document.querySelector('#delete').onclick=()=>{if(!selected)return;checkpoint();scene.remove(selected);objects.splice(objects.indexOf(selected),1);selected=null;updateCount();select(objects.at(-1)||null);};
document.querySelector('#reset').onclick=()=>{yaw=35*Math.PI/180;pitch=18*Math.PI/180;target.set(0,0,0);document.querySelector('#orbitY').value=35;document.querySelector('#orbitX').value=18;};
document.querySelector('#orbitY').oninput=e=>yaw=Number(e.target.value)*Math.PI/180;
document.querySelector('#orbitX').oninput=e=>pitch=Number(e.target.value)*Math.PI/180;
const ray=new THREE.Raycaster(),pointer=new THREE.Vector2();
canvas.addEventListener('pointerdown',e=>{const r=canvas.getBoundingClientRect();pointer.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);ray.setFromCamera(pointer,camera);const hits=ray.intersectObjects(objects);if(!hits.length)return;const hit=hits[0].object;if(magnetArmed){attachTo(hit,selected);magnetArmed=false;document.querySelector('#magnet').classList.remove('active');}else if(hit===selected&&rotateMode){checkpoint();selected.rotation.y+=Math.PI/8;}else if(hit===selected&&scaleMode){checkpoint();selected.scale.multiplyScalar(1.12);}else select(hit);});
function resize(){const r=canvas.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix();}new ResizeObserver(resize).observe(canvas);resize();
document.querySelector('#undo').onclick=undo;document.querySelector('#raster').onclick=()=>{document.querySelector('.view').classList.toggle('raster');document.querySelector('#raster').classList.toggle('active');};document.querySelector('#rasterLevel').oninput=e=>document.querySelector('.view').style.setProperty('--raster-opacity',Number(e.target.value)/100);\nfunction frame(){requestAnimationFrame(frame);updateContacts();const radius=7;camera.position.set(target.x+Math.sin(yaw)*Math.cos(pitch)*radius,target.y+Math.sin(pitch)*radius,target.z+Math.cos(yaw)*Math.cos(pitch)*radius);camera.lookAt(target);renderer.render(scene,camera);}frame();
make('box');
</script></body></html>
