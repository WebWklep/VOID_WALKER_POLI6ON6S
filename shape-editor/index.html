<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CREATURE LAB — FELIX</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;color:#dce3e8;font-family:Arial,Helvetica,sans-serif}
#app{height:100dvh;display:flex;flex-direction:column;background:#050505}
.view{height:78%;flex:1;min-height:0;position:relative;background:radial-gradient(ellipse at 50% 47%,#111820 0%,#080b0f 44%,#050505 76%)}
canvas{display:block;width:100%;height:100%;touch-action:none}
.brand{position:absolute;top:15px;left:17px;font:10px monospace;letter-spacing:.22em;color:#79858e;pointer-events:none}
.subbrand{position:absolute;top:29px;left:17px;font:8px monospace;letter-spacing:.16em;color:#424d55;pointer-events:none}
.axis{position:absolute;opacity:.78;accent-color:#9eabb5}
#orbitY{bottom:13px;left:15%;width:70%;height:18px}
#orbitX{right:8px;top:22%;height:55%;writing-mode:vertical-lr;direction:rtl;width:18px}
.controls{height:22%;min-height:104px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;padding:10px 18px max(15px,env(safe-area-inset-bottom));border-top:1px solid #20272d;background:#080a0d}
button{height:44px;min-width:188px;padding:0 24px;border:1px solid #60717c;background:#11171c;color:#e0e8ed;font:10px monospace;letter-spacing:.17em;cursor:pointer}
button:active{background:#202c34;border-color:#a3b7c2}
.hint{font:8px monospace;letter-spacing:.15em;color:#53606a;text-align:center}
@media(max-height:600px){.view{height:72%}.controls{height:28%;gap:7px}button{height:38px}}
</style>
</head>
<body>
<main id="app">
 <section class="view">
  <canvas id="scene"></canvas>
  <div class="brand">CREATURE LAB</div><div class="subbrand">FELIX · ARTICULATED SERIES 01</div>
  <input class="axis" id="orbitY" type="range" min="-180" max="180" value="24" aria-label="Вращение по горизонтальной оси">
  <input class="axis" id="orbitX" type="range" min="-70" max="70" value="8" aria-label="Вращение по вертикальной оси">
 </section>
 <section class="controls">
  <button id="generate">GENERATE FELIX ↻</button>
  <div class="hint">DRAG TO ROTATE · AXIS CONTROLS</div>
 </section>
</main>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

const canvas=document.querySelector('#scene');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.setClearColor(0x050505);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.12;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x050505);
scene.add(new THREE.HemisphereLight(0xc8d8e8,0x111923,.95));
const key=new THREE.DirectionalLight(0xe4efff,3.0);
key.position.set(-4.5,7,6);
key.castShadow=true;
key.shadow.mapSize.set(1024,1024);
key.shadow.camera.near=.5;key.shadow.camera.far=24;
key.shadow.camera.left=-5;key.shadow.camera.right=5;
key.shadow.camera.top=6;key.shadow.camera.bottom=-6;
key.shadow.bias=-.0003;key.shadow.normalBias=.035;
scene.add(key);
const rim=new THREE.DirectionalLight(0x86a8c6,1.35);
rim.position.set(4,3,-5);scene.add(rim);
const lowFill=new THREE.DirectionalLight(0x657e94,.45);
lowFill.position.set(0,-4,4);scene.add(lowFill);

const camera=new THREE.PerspectiveCamera(36,1,.1,100);
let yaw=24*Math.PI/180,pitch=8*Math.PI/180,drag=null;
let character=null;

const palettes=[
 {shell:0x687f90,light:0x8499a7,dark:0x263641,edge:0xb0c2ca,glow:0x91c4d1},
 {shell:0x75838d,light:0x9aa8af,dark:0x303b45,edge:0xc0cbd0,glow:0x9ec4c9},
 {shell:0x536d78,light:0x718b96,dark:0x202f39,edge:0xa2b8bf,glow:0x8ebcc0},
 {shell:0x667887,light:0x899ba8,dark:0x29343f,edge:0xb3c2cc,glow:0xa8c9d5}
];
const mat=(color,roughness=.52,metalness=.12,extra={})=>new THREE.MeshStandardMaterial({color,roughness,metalness,...extra});
const sphereGeo=new THREE.SphereGeometry(1,18,14);
const jointGeo=new THREE.SphereGeometry(1,16,12);
const dummyY=new THREE.Vector3(0,1,0);

function addMesh(parent,geo,material,pos=[0,0,0],scale=[1,1,1],rot=[0,0,0]){
 const m=new THREE.Mesh(geo,material);
 m.position.set(...pos);m.scale.set(...scale);m.rotation.set(...rot);
 m.castShadow=true;m.receiveShadow=true;parent.add(m);return m;
}
function ellipsoid(parent,material,pos,scale,rot=[0,0,0]){
 return addMesh(parent,sphereGeo,material,pos,scale,rot);
}
function link(parent,a,b,rTop,rBottom,material,segments=12){
 const A=new THREE.Vector3(...a),B=new THREE.Vector3(...b),d=B.clone().sub(A);
 const mesh=new THREE.Mesh(new THREE.CylinderGeometry(rTop,rBottom,d.length(),segments,1),material);
 mesh.position.copy(A).add(B).multiplyScalar(.5);
 mesh.quaternion.setFromUnitVectors(dummyY,d.clone().normalize());
 mesh.castShadow=true;mesh.receiveShadow=true;parent.add(mesh);
 ellipsoid(parent,material,a,[rBottom,rBottom,rBottom]);
 ellipsoid(parent,material,b,[rTop,rTop,rTop]);
 return mesh;
}
function joint(parent,pos,r,materials,frontZ=.34){
 const g=new THREE.Group();g.position.set(pos[0],pos[1],pos[2]);parent.add(g);
 addMesh(g,jointGeo,materials.dark,[0,0,0],[r,r,r]);
 // The bearing ring is deliberately offset to the front so armor cannot bury it.
 const ring=new THREE.Mesh(new THREE.TorusGeometry(r*.78,r*.105,8,20),materials.edge);
 ring.position.z=frontZ-pos[2];ring.castShadow=true;g.add(ring);
 const pin=new THREE.Mesh(new THREE.CylinderGeometry(r*.22,r*.22,r*.13,12),materials.dark);
 pin.rotation.x=Math.PI/2;pin.position.z=frontZ-pos[2]+r*.10;g.add(pin);
 const cap=new THREE.Mesh(new THREE.CircleGeometry(r*.18,12),materials.glow);
 cap.position.z=frontZ-pos[2]+r*.18;g.add(cap);
 return g;
}
function plateShape(parent,points,depth,material,pos=[0,0,0]){
 const s=new THREE.Shape();
 s.moveTo(points[0][0],points[0][1]);
 for(let i=1;i<points.length;i++)s.lineTo(points[i][0],points[i][1]);
 s.closePath();
 const geo=new THREE.ExtrudeGeometry(s,{depth,bevelEnabled:true,bevelSegments:2,steps:1,bevelSize:.025,bevelThickness:.025,curveSegments:4});
 geo.computeVertexNormals();
 return addMesh(parent,geo,material,pos);
}
function makeFelix(){
 if(character){
  scene.remove(character);
  character.traverse(o=>{
   if(o.geometry)o.geometry.dispose();
   if(o.material){if(Array.isArray(o.material))o.material.forEach(m=>m.dispose());else o.material.dispose();}
  });
 }
 const p=palettes[Math.floor(Math.random()*palettes.length)];
 const shell=mat(p.shell,.48,.16);
 const shellLight=mat(p.light,.43,.18);
 const dark=mat(p.dark,.62,.28);
 const edge=mat(p.edge,.34,.38);
 const glow=mat(p.glow,.3,.22,{emissive:p.glow,emissiveIntensity:.12});
 const inset=mat(0x101820,.3,.28);
 const materials={shell,shellLight,dark,edge,glow,inset};
 const root=new THREE.Group();character=root;scene.add(root);

 // Main torso: tapered, deliberately separate from the pelvis.
 const torsoPts=[
  new THREE.Vector2(0,-.66),new THREE.Vector2(.34,-.66),
  new THREE.Vector2(.48,-.48),new THREE.Vector2(.56,-.12),
  new THREE.Vector2(.62,.25),new THREE.Vector2(.52,.49),
  new THREE.Vector2(.36,.63),new THREE.Vector2(0,.66)
 ];
 const torsoGeo=new THREE.LatheGeometry(torsoPts,12);
 torsoGeo.scale(1,1,.76);
 addMesh(root,torsoGeo,shell,[0,.12,0],[1,1,1],[0,0,0]);

 // Chest armor gives the body a clear front and layered silhouette.
 plateShape(root,[[-.43,.30],[-.31,.49],[0,.56],[.31,.49],[.43,.30],[.34,-.10],[0,-.34],[-.34,-.10]],.12,shellLight, [0,.21,.405]);
 plateShape(root,[[-.25,.22],[0,.34],[.25,.22],[.19,-.08],[0,-.2],[-.19,-.08]],.035,dark,[0,.21,.53]);
 const emblem=new THREE.Mesh(new THREE.OctahedronGeometry(.115,0),glow);
 emblem.position.set(0,.29,.59);emblem.rotation.z=Math.PI/4;root.add(emblem);
 // Waist and pelvis are their own movable-looking shells.
 link(root,[0,-.43,.02],[0,-.69,.02],.22,.25,dark,12);
 ellipsoid(root,shell,[0,-.78,0],[.52,.31,.39]);
 plateShape(root,[[-.34,.08],[-.24,.23],[.24,.23],[.34,.08],[.25,-.18],[0,-.27],[-.25,-.18]],.07,shellLight,[0,-.75,.31]);

 // Neck bearing and head socket.
 link(root,[0,.70,0],[0,.98,0],.14,.16,dark,12);
 joint(root,[0,.91,.04],.19,materials,.38);

 // Head is a compact helmet, not a rock or a stack of primitive balls.
 const head=new THREE.Group();head.position.set(0,1.34,.015);root.add(head);
 ellipsoid(head,shellLight,[0,0,0],[.46,.51,.39]);
 ellipsoid(head,shell,[0,-.18,.17],[.39,.30,.32]);
 // Face plate and inset visor.
 plateShape(head,[[-.31,.16],[-.25,.35],[0,.41],[.25,.35],[.31,.16],[.22,-.12],[0,-.23],[-.22,-.12]],.055,dark,[0,.02,.33]);
 const visor=ellipsoid(head,inset,[0,.105,.39],[.285,.13,.045]);
 // Eyes are narrow luminous slits with angled outer corners.
 for(const side of [-1,1]){
  const eye=addMesh(head,new THREE.BoxGeometry(.145,.035,.025),glow,[side*.135,.105,.438],[1,1,1],[0,0,side*-.12]);
  ellipsoid(head,dark,[side*.29,-.01,.22],[.07,.16,.17],[0,0,side*-.28]);
 }
 // Twin swept ear-fins and a variable crown detail.
 for(const side of [-1,1]){
  const ear=addMesh(head,new THREE.ConeGeometry(.145,.40,5,1),shellLight,[side*.39,.35,-.015],[1,1,.72],[0,0,side*-0.72]);
  ellipsoid(head,dark,[side*.38,.22,.02],[.09,.13,.08]);
 }
 const crestCount=1+Math.floor(Math.random()*3);
 for(let i=0;i<crestCount;i++){
  const x=(i-(crestCount-1)/2)*.16;
  addMesh(head,new THREE.ConeGeometry(.085,.25+Math.random()*.12,5),shellLight,[x,.49,-.02],[1,1,.9],[0,0,(i-(crestCount-1)/2)*-.12]);
 }
 // Back-of-head panel seam.
 ellipsoid(head,dark,[0,-.25,-.29],[.27,.17,.10]);

 // Shoulder blocks and articulated arms. All joints sit at the front/outside edge.
 for(const side of [-1,1]){
  const s=side;
  ellipsoid(root,shellLight,[s*.72,.48,.015],[.34,.34,.39],[0,0,s*-.18]);
  joint(root,[s*.88,.42,.12],.235,materials,.42);
  link(root,[s*.90,.36,.02],[s*1.10,-.17,.015],.205,.235,shell,10);
  // Upper-arm outer armor plate.
  ellipsoid(root,shellLight,[s*1.015,.10,.19],[.20,.34,.20],[0,0,s*-.30]);
  joint(root,[s*1.12,-.20,.11],.205,materials,.42);
  link(root,[s*1.12,-.28,.02],[s*1.22,-.78,.02],.205,.27,shell,10);
  // Forearm shield, tapered toward the wrist.
  ellipsoid(root,shellLight,[s*1.18,-.52,.18],[.235,.31,.22],[0,0,s*-.12]);
  joint(root,[s*1.23,-.80,.10],.16,materials,.38);
  link(root,[s*1.23,-.82,.02],[s*1.25,-.98,.05],.14,.16,dark,10);
  // Three-pronged hand: one palm and three clearly separated blunt talons.
  ellipsoid(root,shell,[s*1.25,-1.10,.11],[.23,.22,.19],[0,0,s*-.10]);
  for(let k=-1;k<=1;k++){
   const x=s*1.25+k*.145;
   const start=[x,-1.19,.17];
   const end=[x+s*k*.045,-1.43-(k===0?.05:0),.19];
   link(root,start,end,.065,.09,shellLight,7);
   addMesh(root,new THREE.ConeGeometry(.067,.13,6),shellLight,end,[1,1,1],[Math.PI,0,s*k*.16]);
  }
 }

 // Short, broad legs with open knee bearings and sculpted boots.
 for(const side of [-1,1]){
  const s=side;
  joint(root,[s*.37,-.78,.20],.19,materials,.42);
  link(root,[s*.38,-.82,.02],[s*.45,-1.30,.015],.245,.22,shell,10);
  ellipsoid(root,shellLight,[s*.40,-1.07,.15],[.22,.31,.19],[0,0,s*.08]);
  joint(root,[s*.45,-1.31,.18],.205,materials,.43);
  link(root,[s*.45,-1.36,.02],[s*.49,-1.88,.02],.205,.26,shell,10);
  // Shin armor is a separate forward-facing plate.
  plateShape(root,[[-.14,.22],[.14,.22],[.18,-.17],[0,-.34],[-.18,-.17]],.055,shellLight,[s*.49-.0,-1.56,.235]);
  joint(root,[s*.49,-1.89,.10],.155,materials,.38);
  // Wide feet are angled slightly forward so the stance reads clearly.
  ellipsoid(root,dark,[s*.50,-2.03,.18],[.29,.16,.43],[0,0,s*-.06]);
  ellipsoid(root,shellLight,[s*.50,-2.00,.29],[.25,.09,.30],[0,0,s*-.06]);
  // Toe marker.
  addMesh(root,new THREE.BoxGeometry(.11,.025,.025),glow,[s*.50,-1.98,.56],[1,1,1]);
 }

 // Subtle back pack gives a recognizable side/back profile.
 ellipsoid(root,dark,[0,.18,-.43],[.35,.42,.18]);
 for(const side of [-1,1]){
  link(root,[side*.18,.38,-.48],[side*.22,-.12,-.51],.065,.065,edge,8);
 }
 root.rotation.y=0;
 return root;
}

function generate(){makeFelix();}
generate();

const orbitY=document.querySelector('#orbitY');
const orbitX=document.querySelector('#orbitX');
orbitY.addEventListener('input',e=>yaw=Number(e.target.value)*Math.PI/180);
orbitX.addEventListener('input',e=>pitch=Number(e.target.value)*Math.PI/180);
document.querySelector('#generate').addEventListener('click',generate);

canvas.addEventListener('pointerdown',e=>{
 drag={x:e.clientX,y:e.clientY,id:e.pointerId};
 canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove',e=>{
 if(!drag)return;
 const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
 drag.x=e.clientX;drag.y=e.clientY;
 yaw+=dx*.008;
 pitch=THREE.MathUtils.clamp(pitch+dy*.006,-1.12,1.12);
 orbitY.value=THREE.MathUtils.clamp(Math.round(yaw*180/Math.PI),-180,180);
 orbitX.value=Math.round(pitch*180/Math.PI);
});
canvas.addEventListener('pointerup',()=>drag=null);
canvas.addEventListener('pointercancel',()=>drag=null);

function resize(){
 const r=canvas.getBoundingClientRect();
 if(!r.width||!r.height)return;
 renderer.setSize(r.width,r.height,false);
 camera.aspect=r.width/r.height;
 camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(canvas);
window.addEventListener('resize',resize);
resize();

function frame(){
 requestAnimationFrame(frame);
 const distance=8.15;
 camera.position.set(Math.sin(yaw)*Math.cos(pitch)*distance,
  .02+Math.sin(pitch)*distance,
  Math.cos(yaw)*Math.cos(pitch)*distance);
 camera.lookAt(0,-.02,0);
 renderer.render(scene,camera);
}
frame();
</script>
</body>
</html>
