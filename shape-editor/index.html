<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CREATURE LAB — REBUILD</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;color:#ddd;font-family:Arial,Helvetica,sans-serif}
#app{height:100dvh;display:flex;flex-direction:column;background:#050505}
.view{height:76%;flex:1;min-height:0;position:relative;background:#050505}
canvas{display:block;width:100%;height:100%;touch-action:none}
.brand{position:absolute;top:15px;left:17px;font:10px monospace;letter-spacing:.22em;color:#777;pointer-events:none}
#orbitY{position:absolute;bottom:13px;left:15%;width:70%;accent-color:#ddd;height:18px}
#orbitX{position:absolute;right:8px;top:22%;height:55%;writing-mode:vertical-lr;direction:rtl;accent-color:#ddd;width:18px}
.controls{height:24%;min-height:112px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:15px;padding:12px 18px max(16px,env(safe-area-inset-bottom));border-top:1px solid #242424}
button{height:46px;min-width:170px;padding:0 24px;border:1px solid #555;background:#101010;color:#ddd;font:11px monospace;letter-spacing:.16em}
button:active{background:#252525;border-color:#aaa}
.hint{font:9px monospace;letter-spacing:.13em;color:#555;text-align:center}
@media(max-height:600px){.view{height:70%}.controls{height:30%;gap:8px}button{height:40px}}
</style>
</head>
<body><main id="app">
<section class="view"><canvas id="scene"></canvas><div class="brand">CREATURE LAB · REBUILT</div><input id="orbitY" type="range" min="-180" max="180" value="35" aria-label="Вращение по горизонтальной оси"><input id="orbitX" type="range" min="-70" max="70" value="12" aria-label="Вращение по вертикальной оси"></section>
<section class="controls"><button id="generate">GENERATE CREATURE ↻</button><div class="hint">DRAG OR USE AXIS CONTROLS · BLACK STAGE</div></section>
</main>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const canvas=document.querySelector('#scene');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setClearColor(0x050505);
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x050505);
scene.add(new THREE.HemisphereLight(0xb8c5dc,0x080d18,.72));
const key=new THREE.DirectionalLight(0xe1e8f5,3.1);key.position.set(-4,7,5);key.castShadow=true;key.shadow.mapSize.set(1024,1024);key.shadow.camera.near=.5;key.shadow.camera.far=24;key.shadow.camera.left=-5;key.shadow.camera.right=5;key.shadow.camera.top=6;key.shadow.camera.bottom=-6;key.shadow.bias=-.00035;key.shadow.normalBias=.04;scene.add(key);
const fill=new THREE.DirectionalLight(0x8298bb,.38);fill.position.set(5,1,-4);scene.add(fill);
const camera=new THREE.PerspectiveCamera(38,1,.1,100);
let yaw=35*Math.PI/180,pitch=12*Math.PI/180,drag=null;
const root=new THREE.Group();scene.add(root);
const stone=new THREE.MeshStandardMaterial({color:0x8997a4,roughness:1,metalness:0,flatShading:true});
const jointMat=new THREE.MeshStandardMaterial({color:0x9aa7b2,roughness:1,metalness:0,flatShading:true});
function rock(parent,geo,mat,pos,scale,rot=[0,0,0]){const m=new THREE.Mesh(geo,mat);m.position.set(...pos);m.scale.set(...scale);m.rotation.set(...rot);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m;}
function poly(radius,detail=1){return new THREE.IcosahedronGeometry(radius,detail);}
function limb(parent,a,b,r1,r2,mat){const start=new THREE.Vector3(...a),end=new THREE.Vector3(...b),dir=end.clone().sub(start);const mesh=new THREE.Mesh(new THREE.CylinderGeometry(r2,r1,dir.length(),7,1),mat);mesh.position.copy(start).add(end).multiplyScalar(.5);mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.normalize());mesh.castShadow=true;mesh.receiveShadow=true;parent.add(mesh);return mesh;}
function makeCreature(){
 root.clear();
 const torso=rock(root,poly(1,1),stone,[0,0,0],[.83,.94,.58],[0,.08,0]);
 // Shoulder mantle: broad upper mass, compact lower torso.
 rock(root,poly(.72,1),stone,[0,.43,0],[1.13,.62,.72],[0,0,.03]);
 rock(root,poly(.55,1),stone,[0,-.52,.015],[.86,.68,.66],[0,0,0]);
 // Head: tall, angular mask-like crag with a strong brow and crown silhouette.
 const head=new THREE.Group();head.position.set(0,1.18,.015);root.add(head);
 rock(head,poly(.53,1),stone,[0,.08,0],[.83,1.08,.76],[0,0,0]);
 rock(head,poly(.34,1),stone,[0,-.28,.34],[.9,.55,.46],[0,0,0]);
 // Five irregular crown horns, deliberately part of the head silhouette.
 const hornGeo=new THREE.ConeGeometry(.16,.53,5,1);
 for(let i=0;i<5;i++){const x=(i-2)*.19;const h=.38+(1-Math.abs(i-2)/2)*.2;rock(head,new THREE.ConeGeometry(.14,h,5,1),stone,[x,.86+(i===2?.06:0),-.015],[1,1,1],[0,0,(2-i)*-.12]);}
 const dark=new THREE.MeshStandardMaterial({color:0x10151b,roughness:1});
 for(const side of [-1,1]){const eye=new THREE.Mesh(new THREE.BoxGeometry(.22,.045,.035),dark);eye.position.set(side*.19,.02,.405);eye.rotation.z=side*.12;head.add(eye);}
 // Neck socket is intentionally visible, like a vintage articulated figure.
 rock(root,poly(.22,1),jointMat,[0,.82,.02],[1,1,.9]);
 // Arms: upper stone masses, exposed half-sphere elbows, heavy forearms and three blunt talons.
 for(const side of [-1,1]){
  const shoulder=[side*.78,.48,0],elbow=[side*1.02,-.12,.025],wrist=[side*1.10,-.78,.08];
  rock(root,poly(.34,1),jointMat,[...shoulder],[1,1,1]);
  limb(root,shoulder,[side*.96,.05,.015],.27,.23,stone);
  rock(root,poly(.205,1),jointMat,[...elbow],[1,1,1]);
  limb(root,elbow,wrist,.27,.34,stone);
  rock(root,poly(.30,1),stone,[side*1.10,-.79,.08],[1.02,1.12,.95]);
  for(let k=-1;k<=1;k++){const claw=rock(root,new THREE.ConeGeometry(.105,.30,5,1),stone,[side*1.10+k*.17,-1.08,.22],[1,1,1],[0,0,Math.PI+(k*.22)]);}
 }
 // Short, sturdy legs with visible hip and knee joints.
 for(const side of [-1,1]){
  const hip=[side*.39,-.72,0],knee=[side*.44,-1.25,.025],ankle=[side*.48,-1.78,.08];
  rock(root,poly(.22,1),jointMat,hip,[1,1,1]);
  limb(root,hip,knee,.28,.24,stone);
  rock(root,poly(.17,1),jointMat,knee,[1,1,1]);
  limb(root,knee,ankle,.23,.31,stone);
  rock(root,poly(.34,1),stone,[side*.49,-1.84,.22],[1.12,.58,1.35]);
 }
}
function generate(){makeCreature();root.rotation.set(0,0,0);}
makeCreature();
const orbitY=document.querySelector('#orbitY'),orbitX=document.querySelector('#orbitX');
orbitY.addEventListener('input',e=>yaw=Number(e.target.value)*Math.PI/180);
orbitX.addEventListener('input',e=>pitch=Number(e.target.value)*Math.PI/180);
document.querySelector('#generate').addEventListener('click',generate);
canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,id:e.pointerId};canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;yaw+=dx*.008;pitch=THREE.MathUtils.clamp(pitch+dy*.006,-1.2,1.2);orbitY.value=Math.round(yaw*180/Math.PI);orbitX.value=Math.round(pitch*180/Math.PI);});
canvas.addEventListener('pointerup',()=>drag=null);canvas.addEventListener('pointercancel',()=>drag=null);
function resize(){const r=canvas.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(canvas);resize();
function frame(){requestAnimationFrame(frame);camera.position.set(Math.sin(yaw)*Math.cos(pitch)*7,Math.sin(pitch)*7+0.1,Math.cos(yaw)*Math.cos(pitch)*7);camera.lookAt(0,0,0);renderer.render(scene,camera);}frame();
</script></body></html>
