function updateContacts(){for(const o of objects){let touching=false;const a=new THREE.Box3().setFromObject(o);for(const p of objects){if(p===o)continue;const b=new THREE.Box3().setFromObject(p),e=.025;const overlapX=Math.min(a.max.x,b.max.x)-Math.max(a.min.x,b.min.x),overlapY=Math.min(a.max.y,b.max.y)-Math.max(a.min.y,b.min.y),overlapZ=Math.min(a.max.z,b.max.z)-Math.max(a.min.z,b.min.z);const face=(Math.abs(a.max.x-b.min.x)<e||Math.abs(b.max.x-a.min.x)<e)&&overlapY>0&&overlapZ>0||(Math.abs(a.max.y-b.min.y)<e||Math.abs(b.max.y-a.min.y)<e)&&overlapX>0&&overlapZ>0||(Math.abs(a.max.z-b.min.z)<e||Math.abs(b.max.z-a.min.z)<e)&&overlapX>0&&overlapY>0;if(face){touching=true;break;}}setPartLine(o,o===selected?selectedMat:touching?contactMat:lineMat);}}function updateCount(){document.querySelector('#count').textContent=String(objects.length).padStart(2,'0')+' OBJECT'+(objects.length===1?'':'S');}

function attachTo(targetObj,moving){if(!targetObj||!moving||targetObj===moving)return;checkpoint();const a=new THREE.Box3().setFromObject(targetObj),b=new THREE.Box3().setFromObject(moving);const ac=a.getCenter(new THREE.Vector3()),bc=b.getCenter(new THREE.Vector3());const delta=bc.sub(ac);let axis='x';if(Math.abs(delta.y)>Math.abs(delta.x)&&Math.abs(delta.y)>Math.abs(delta.z))axis='y';else if(Math.abs(delta.z)>Math.abs(delta.x))axis='z';const gap=.015;const pos=targetObj.position.clone();const da=dims(targetObj),db=dims(moving);const sign=delta[axis]>=0?1:-1;pos[axis]+=sign*(da[axis]+db[axis])/2+sign*gap;moving.position.copy(pos);document.querySelector('#status').textContent='MAGNETICALLY ALIGNED';}

function localBounds(o){
const g=geometry(o.userData.type);g.computeBoundingBox();const b=g.boundingBox;

}
function socketPlace(part,target,role,side=1){
if(!part||!target)return;
const p=localBounds(part),t=localBounds(target);
const center=target.position.clone();
let socket=new THREE.Vector3(),connector=new THREE.Vector3();
if(role==='HEAD'){
socket.set(0,t.max.y,0);connector.set(0,p.min.y,0);
}else if(role==='ARM'){
socket.set(side*(t.max.x+.025),t.min.y+(t.max.y-t.min.y)*.66,0);
connector.set(-side*p.max.x,0,0);
}else if(role==='LEG'){
socket.set(side*(t.max.x*.42),t.min.y-.025,0);
connector.set(0,0,0);
}else if(role==='TOP'){
socket.set(0,t.max.y+.015,0);connector.set(0,p.min.y,0);
}else if(role==='EYE'){
// The eye sits mostly inside the head, leaving only its dark center visible.
socket.set(side*(t.max.x*.23),.08,t.max.z*.76);
connector.set(0,0,0);
}else if(role==='BOTTOM'){
socket.set(side*.12,t.min.y+.025,0);connector.set(0,p.max.y,0);
}
part.position.copy(center.add(socket).sub(connector));
part.userData.socketRole=role;part.userData.socketSide=side;
if(role==='LEG')part.userData.pivot='HIP';
}
function socketPlaceArm(part,target,side=1){
const t=localBounds(target);
// The arm object's origin is now its shoulder pivot, so rotation happens at the socket.
const socket=new THREE.Vector3(side*(t.max.x-.045),.18,0);
part.position.copy(target.position).add(socket);
part.userData.socketRole='ARM';part.userData.socketSide=side;part.userData.pivot='SHOULDER';
}
function getMainBody(){return objects.find(x=>x.userData.category==='BODY'||x.userData.part==='CORE'||x.userData.type.startsWith('body_'))||null;}
function reflowParts(){
const body=getMainBody();if(!body)return;
const head=objects.find(x=>x.userData.category==='HEAD');
for(const o of objects){if(o===body)continue;
if(o.userData.category==='HEAD')socketPlace(o,body,'HEAD');
else if(o.userData.category==='ARMS')socketPlaceArm(o,body,o.userData.side||1);
else if(o.userData.category==='LEGS')socketPlace(o,body,'LEG',o.userData.side||1);
else if(o.userData.category==='EXTRAS'){const target=head||body;socketPlace(o,target,o.userData.socketRole||'TOP',o.userData.socketSide||1);}
}
}
