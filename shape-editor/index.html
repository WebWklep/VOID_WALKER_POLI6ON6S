<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>STONE STUDY</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101417;color:#dce1e3;font-family:Arial,sans-serif}
#app{height:100dvh;display:flex;flex-direction:column;background:#101417}
.view{position:relative;flex:1;min-height:0;overflow:hidden;background:radial-gradient(ellipse at 50% 43%,#465057 0%,#293238 39%,#151c20 75%,#0d1215 100%)}
canvas{display:block;width:100%;height:100%;touch-action:none}
.brand{position:absolute;top:16px;left:18px;font:10px monospace;letter-spacing:.24em;color:#d0d8dc;pointer-events:none;text-shadow:0 1px 5px #101518}
.subtitle{position:absolute;top:31px;left:18px;font:8px monospace;letter-spacing:.17em;color:#a5b0b6;pointer-events:none}
.readout{position:absolute;right:17px;top:15px;text-align:right;font:8px monospace;letter-spacing:.12em;color:#c0c9ce;line-height:1.8;pointer-events:none;text-shadow:0 1px 5px #101518}
.controls{padding:9px 13px max(11px,env(safe-area-inset-bottom));border-top:1px solid #343d42;background:#0b1013;display:grid;grid-template-columns:58px 1fr 1fr;gap:8px;align-items:center}
button{height:40px;border:1px solid #4a565d;background:#182126;color:#dce3e6;font:9px monospace;letter-spacing:.1em}
button:active{background:#344149;border-color:#c1cbd0}button.primary{background:#d7dfe2;color:#101619;border-color:#d7dfe2}
#generate{font:25px Arial,sans-serif;letter-spacing:0}
.axisrow{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:1px 5px 0}
.axisbox{display:grid;grid-template-columns:24px 1fr;align-items:center;gap:7px;color:#89969d;font:8px monospace;letter-spacing:.12em}
input[type=range]{width:100%;height:17px;accent-color:#c0ccd2}
.hint{grid-column:1/-1;text-align:center;font:7px monospace;letter-spacing:.13em;color:#69767d}
#gallery{position:absolute;inset:0;background:rgba(7,10,12,.97);z-index:5;display:none;flex-direction:column;padding:18px 14px max(14px,env(safe-area-inset-bottom))}
.galleryHead{display:flex;justify-content:space-between;align-items:center;font:10px monospace;letter-spacing:.16em;padding-bottom:14px}
#closeGallery{height:30px;padding:0 12px}#items{overflow:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;align-content:start}
.card{border:1px solid #343d42;background:#111619;min-width:0}.thumb{width:100%;aspect-ratio:1.25;object-fit:cover;display:block}.cardInfo{display:flex;align-items:center;justify-content:space-between;padding:7px;font:8px monospace;color:#b4bec3;gap:4px}.cardInfo button{height:26px;padding:0 7px;font-size:8px}
.empty{grid-column:1/-1;color:#899399;font:10px monospace;line-height:1.8;padding:20px 2px}
@media(min-width:700px){.controls{padding-left:calc((100% - 560px)/2);padding-right:calc((100% - 560px)/2)}#items{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style></head>
<body><main id="app"><section class="view">
<canvas id="scene"></canvas><div class="brand">STONE STUDY</div><div class="subtitle">ONE SPECIMEN · NATURAL MATERIALS</div><div class="readout" id="readout">SPECIMEN 001<br>PEBBLE</div>
<div id="gallery"><div class="galleryHead"><span>COLLECTED SPECIMENS</span><button id="closeGallery">CLOSE ×</button></div><div id="items"></div></div>
</section><section class="controls">
<button class="primary" id="generate" aria-label="Новый камень">⚄</button><button id="save">SAVE SPECIMEN +</button><button id="collection">COLLECTION ◇</button>
<div class="axisrow"><label class="axisbox">Y <input id="orbitY" type="range" min="-180" max="180" value="28"></label><label class="axisbox">X <input id="orbitX" type="range" min="-70" max="70" value="12"></label></div>
<div class="hint">DRAG TO ROTATE · AXIS SLIDERS · SAVE YOUR FAVORITES</div>
</section></main>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","RoomEnvironment":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/environments/RoomEnvironment.js"}}</script>
<script type="module">
import * as THREE from 'three';
import {RoomEnvironment} from 'RoomEnvironment';
const canvas=document.querySelector('#scene');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.6));renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;
renderer.setClearColor(0x252e33,1);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x252e33);
const pmrem=new THREE.PMREMGenerator(renderer);
const env=pmrem.fromScene(new RoomEnvironment(),.04);scene.environment=env.texture;
scene.add(new THREE.HemisphereLight(0xe6eff5,0x3a3530,1.0));
const key=new THREE.DirectionalLight(0xffe8c9,3.4);key.position.set(-4,6,5);scene.add(key);
const fill=new THREE.DirectionalLight(0xa9c9e2,1.5);fill.position.set(5,1,-4);scene.add(fill);
const rim=new THREE.DirectionalLight(0xffffff,1.0);rim.position.set(1,4,4);scene.add(rim);
const camera=new THREE.PerspectiveCamera(34,1,.1,100);
let yaw=28*Math.PI/180,pitch=12*Math.PI/180,drag=null,currentSeed=1,currentName='PEBBLE',specimenNo=0,rock=null,center=new THREE.Vector3(),distance=4.4;
const palettes=[
 {name:'RIVER PEBBLE',base:[111,119,119],rough:.31},
 {name:'MOSS BOULDER',base:[91,96,79],rough:.78},
 {name:'SANDSTONE',base:[166,139,105],rough:.88},
 {name:'GRANITE',base:[111,113,111],rough:.62},
 {name:'LIMESTONE',base:[171,166,148],rough:.76},
 {name:'DARK BASALT',base:[63,70,73],rough:.48},
 {name:'QUARTZITE',base:[157,163,161],rough:.38},
 {name:'IRONSTONE',base:[117,91,75],rough:.7}
];
function rng(seed){let a=seed>>>0;return()=>{a+=0x6D2B79F5;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};}
function hash(x,y,z){const n=Math.sin(x*127.1+y*311.7+z*74.7)*43758.5453;return n-Math.floor(n);}
function noise(x,y,z){const X=Math.floor(x),Y=Math.floor(y),Z=Math.floor(z),u=x-X,v=y-Y,w=z-Z;const s=t=>t*t*(3-2*t);const U=s(u),V=s(v),W=s(w);const a=hash(X,Y,Z),b=hash(X+1,Y,Z),c=hash(X,Y+1,Z),d=hash(X+1,Y+1,Z),e=hash(X,Y,Z+1),f=hash(X+1,Y,Z+1),g=hash(X,Y+1,Z+1),h=hash(X+1,Y+1,Z+1);return THREE.MathUtils.lerp(THREE.MathUtils.lerp(THREE.MathUtils.lerp(a,b,U),THREE.MathUtils.lerp(c,d,U),V),THREE.MathUtils.lerp(THREE.MathUtils.lerp(e,f,U),THREE.MathUtils.lerp(g,h,U),V),W);}
function fbm(x,y,z){return noise(x,y,z)*.55+noise(x*2.1+7,y*2.1,z*2.1)*.27+noise(x*4.2,y*4.2,z*4.2)*.13+noise(x*8.4,y*8.4,z*8.4)*.05;}
function makeMaps(seed,pal){
 const size=512,rand=rng(seed^0x3a71),color=document.createElement('canvas'),bump=document.createElement('canvas');color.width=color.height=bump.width=bump.height=size;
 const c=color.getContext('2d'),b=bump.getContext('2d'),im=c.createImageData(size,size),bi=b.createImageData(size,size);
 for(let y=0;y<size;y++)for(let x=0;x<size;x++){
  const u=x/size,v=y/size,n=fbm(u*12+seed*.0001,v*12,seed*.0002),fine=(rand()-.5)*20;
  const stratum=Math.sin(v*42+Math.sin(u*11+seed)*1.4)*3.5;
  const val=(n-.5)*26+fine+stratum,i=(y*size+x)*4;
  im.data[i]=THREE.MathUtils.clamp(pal.base[0]+val,0,255);im.data[i+1]=THREE.MathUtils.clamp(pal.base[1]+val,0,255);im.data[i+2]=THREE.MathUtils.clamp(pal.base[2]+val,0,255);im.data[i+3]=255;
  const h=fbm(u*45+3,v*45+8,seed*.001);const g=THREE.MathUtils.clamp(128+(h-.5)*150+(rand()-.5)*45,0,255);
  bi.data[i]=bi.data[i+1]=bi.data[i+2]=g;bi.data[i+3]=255;
 }
 c.putImageData(im,0,0);b.putImageData(bi,0,0);
 const map=new THREE.CanvasTexture(color),bumpMap=new THREE.CanvasTexture(bump);
 map.colorSpace=THREE.SRGBColorSpace;map.wrapS=map.wrapT=THREE.RepeatWrapping;map.anisotropy=8;
 bumpMap.wrapS=bumpMap.wrapT=THREE.RepeatWrapping;bumpMap.anisotropy=8;
 return {map,bumpMap};
}
function makeGeometry(seed,type){
 const rand=rng(seed),geo=new THREE.SphereGeometry(1,48,32),p=geo.attributes.position;
 const phase=[rand()*30,rand()*30,rand()*30];
 for(let i=0;i<p.count;i++){
  const v=new THREE.Vector3(p.getX(i),p.getY(i),p.getZ(i));
  const n=fbm(v.x*3.1+phase[0],v.y*3.1+phase[1],v.z*3.1+phase[2]);
  let r=1+(n-.5)*.22+(rand()-.5)*.018;
  if(type==='pebble')r=1+(n-.5)*.11+(rand()-.5)*.008;
  if(type==='sandstone')r+=Math.sin(v.y*15+noise(v.x*4,v.z*4,v.y*3)*3)*.035;
  if(type==='granite')r+=Math.sin(v.x*9+v.z*7)*.035;
  if(type==='shard')r+=Math.max(0,v.y)*.16;
  v.multiplyScalar(r);
  if(type==='pebble'){v.x*=1.18;v.y*=.78;v.z*=.95;}
  if(type==='boulder'){v.x*=1.13;v.y*=.91;v.z*=1.02;}
  if(type==='sandstone'){v.x*=1.12;v.y*=.88;v.z*=.91;}
  if(type==='shard'){v.x*=.88;v.y*=1.18;v.z*=.82;}
  p.setXYZ(i,v.x,v.y,v.z);
 }
 geo.computeVertexNormals();
 if(type==='moss'){
  const colors=[];const p=geo.attributes.position;
  for(let i=0;i<p.count;i++){const x=p.getX(i),y=p.getY(i),z=p.getZ(i);const patch=noise(x*5+2,y*5+7,z*5+4);const mask=THREE.MathUtils.smoothstep(y+patch*.16,.16,.58)*THREE.MathUtils.smoothstep(patch,.38,.72);const stone=new THREE.Color(0xffffff),moss=new THREE.Color(0x526342);stone.lerp(moss,mask*.9);colors.push(stone.r,stone.g,stone.b);}
  geo.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));
 }
 return geo;
}
function build(seed){
 if(rock){scene.remove(rock);rock.geometry.dispose();rock.material.map?.dispose();rock.material.bumpMap?.dispose();rock.material.dispose();}
 currentSeed=seed;const rand=rng(seed),pal=palettes[Math.floor(rand()*palettes.length)];
 const types=['pebble','boulder','sandstone','granite','shard','moss','natural'];
 const type=pal.name==='RIVER PEBBLE'?'pebble':pal.name==='MOSS BOULDER'?'moss':pal.name==='SANDSTONE'?'sandstone':pal.name==='GRANITE'?'granite':pal.name==='DARK BASALT'?'shard':types[Math.floor(rand()*types.length)];
 currentName=pal.name;
 const maps=makeMaps(seed,pal);
 const material=new THREE.MeshStandardMaterial({map:maps.map,bumpMap:maps.bumpMap,bumpScale:.027,roughness:pal.rough,metalness:.015,envMapIntensity:1.05,vertexColors:type==='moss'});
 rock=new THREE.Mesh(makeGeometry(seed,type),material);rock.castShadow=false;rock.receiveShadow=false;
 rock.scale.setScalar(type==='pebble'?1.02:.94);rock.position.y=0;scene.add(rock);
 const box=new THREE.Box3().setFromObject(rock),sphere=box.getBoundingSphere(new THREE.Sphere());center.copy(sphere.center);
 distance=sphere.radius/Math.sin(THREE.MathUtils.degToRad(camera.fov/2))*1.48;
 document.querySelector('#readout').innerHTML='SPECIMEN '+String(specimenNo).padStart(3,'0')+'<br>'+pal.name;
}
function next(){specimenNo++;build((Math.random()*0xffffffff)>>>0);}next();
const orbitY=document.querySelector('#orbitY'),orbitX=document.querySelector('#orbitX');
orbitY.addEventListener('input',e=>yaw=Number(e.target.value)*Math.PI/180);orbitX.addEventListener('input',e=>pitch=Number(e.target.value)*Math.PI/180);
canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;yaw+=dx*.008;pitch=THREE.MathUtils.clamp(pitch+dy*.006,-1.15,1.15);orbitY.value=THREE.MathUtils.clamp(Math.round(yaw*180/Math.PI),-180,180);orbitX.value=Math.round(pitch*180/Math.PI);});
canvas.addEventListener('pointerup',()=>drag=null);canvas.addEventListener('pointercancel',()=>drag=null);
document.querySelector('#generate').addEventListener('click',next);
const storeKey='stone-study-favorites-v1';const readSaved=()=>{try{return JSON.parse(localStorage.getItem(storeKey)||'[]');}catch{return[];}};
document.querySelector('#save').addEventListener('click',()=>{const a=readSaved();if(a.some(x=>x.seed===currentSeed))return; a.unshift({seed:currentSeed,name:currentName,no:specimenNo,thumb:renderer.domElement.toDataURL('image/jpeg',.78)});localStorage.setItem(storeKey,JSON.stringify(a.slice(0,60)));document.querySelector('#save').textContent='SAVED ✓';setTimeout(()=>document.querySelector('#save').textContent='SAVE SPECIMEN +',1100);});
const gallery=document.querySelector('#gallery'),items=document.querySelector('#items');
function showGallery(){const a=readSaved();items.innerHTML='';if(!a.length)items.innerHTML='<div class="empty">NO SAVED SPECIMENS YET.<br>Generate stones and save the ones you like.</div>';a.forEach((item,index)=>{const card=document.createElement('div');card.className='card';const img=document.createElement('img');img.className='thumb';img.src=item.thumb;const info=document.createElement('div');info.className='cardInfo';const label=document.createElement('span');label.textContent=item.name+' · '+String(item.no).padStart(3,'0');const load=document.createElement('button');load.textContent='VIEW';load.onclick=()=>{specimenNo=item.no;build(item.seed);gallery.style.display='none';};const del=document.createElement('button');del.textContent='×';del.onclick=()=>{const all=readSaved();all.splice(index,1);localStorage.setItem(storeKey,JSON.stringify(all));showGallery();};info.append(label,load,del);card.append(img,info);items.append(card);});gallery.style.display='flex';}
document.querySelector('#collection').onclick=showGallery;document.querySelector('#closeGallery').onclick=()=>gallery.style.display='none';
function resize(){const r=canvas.getBoundingClientRect();if(!r.width||!r.height)return;renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix();if(rock){const box=new THREE.Box3().setFromObject(rock),s=box.getBoundingSphere(new THREE.Sphere());distance=s.radius/Math.sin(THREE.MathUtils.degToRad(camera.fov/2))*1.48;}}
new ResizeObserver(resize).observe(canvas);window.addEventListener('resize',resize);resize();
function frame(){requestAnimationFrame(frame);camera.position.set(center.x+Math.sin(yaw)*Math.cos(pitch)*distance,center.y+Math.sin(pitch)*distance,center.z+Math.cos(yaw)*Math.cos(pitch)*distance);camera.lookAt(center);renderer.render(scene,camera);}frame();
</script></body></html>
