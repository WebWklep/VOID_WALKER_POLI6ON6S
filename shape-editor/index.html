<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>STONE STUDY</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#dce1e3;font-family:Arial,sans-serif}
#app{height:100dvh;display:flex;flex-direction:column;background:#000}
.view{position:relative;flex:0 0 60%;min-height:0;overflow:hidden;background:#000}
canvas{display:block;width:100%;height:100%;touch-action:none}
.brand{position:absolute;top:16px;left:18px;font:10px monospace;letter-spacing:.24em;color:#aeb8bd;pointer-events:none}
.subtitle{position:absolute;top:31px;left:18px;font:8px monospace;letter-spacing:.17em;color:#657178;pointer-events:none}
.readout{position:absolute;right:17px;top:15px;text-align:right;font:8px monospace;letter-spacing:.12em;color:#879399;line-height:1.8;pointer-events:none}
.controls{flex:1;min-height:0;padding:15px 13px max(13px,env(safe-area-inset-bottom));background:#000;display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:18px;align-content:start;align-items:center}
button{height:43px;border:0;border-radius:0;background:transparent;color:#c4cdd1;font:9px monospace;letter-spacing:.12em;transition:opacity .2s}
button:active{opacity:.55}button.primary{background:transparent;color:#fff;font-weight:bold}
#generate{font:9px monospace;letter-spacing:.13em}
.hint{grid-column:1/-1;text-align:center;font:7px monospace;letter-spacing:.13em;color:#58646a;padding-top:12px}
.view.earthquake{animation:quake .38s ease-out}
@keyframes quake{0%,100%{transform:translate(0,0)}15%{transform:translate(-3px,1px)}30%{transform:translate(3px,-1px)}45%{transform:translate(-2px,2px)}60%{transform:translate(2px,0)}75%{transform:translate(-1px,-1px)}}
#gallery{position:fixed;inset:0;background:#000;z-index:20;display:none;flex-direction:column;padding:28px 22px max(22px,env(safe-area-inset-bottom))}
.galleryHead{display:flex;justify-content:space-between;align-items:center;font:10px monospace;letter-spacing:.2em;padding-bottom:30px;color:#d5dcdf}
#closeGallery{height:34px;padding:0 8px}
#items{overflow:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:30px;row-gap:44px;align-content:start;padding:4px 2px 30px}
.card{background:transparent;min-width:0;text-align:center;cursor:pointer}
.thumb{width:100%;aspect-ratio:1/1;object-fit:contain;display:block;background:#000}
.cardInfo{display:block;padding:10px 0 0;font:9px monospace;letter-spacing:.16em;color:#929da2}
.cardInfo button{display:none}
.empty{grid-column:1/-1;color:#899399;font:10px monospace;line-height:1.8;padding:20px 2px}
@media(min-width:700px){.controls{padding-left:calc((100% - 560px)/2);padding-right:calc((100% - 560px)/2)}#items{grid-template-columns:repeat(3,minmax(0,1fr));column-gap:56px;row-gap:64px}.thumb{aspect-ratio:1/1}}
</style></head>
<body><main id="app"><section class="view">
<canvas id="scene"></canvas><div class="brand">STONE STUDY</div><div class="subtitle">ONE SPECIMEN · NATURAL MATERIALS</div><div class="readout" id="readout">SPECIMEN 001<br>PEBBLE</div>
<div id="gallery"><div class="galleryHead"><span>COLLECTED SPECIMENS</span><button id="closeGallery">CLOSE ×</button></div><div id="items"></div></div>
</section><section class="controls">
<button class="primary" id="generate" aria-label="Earthquake — новый образец">EARTHQUAKE</button><button id="save">SAVE SPECIMEN +</button><button id="collection">COLLECTION ◇</button>
<div class="hint">DRAG TO EXPLORE · SLOW FLOATING ROTATION</div>
</section></main>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","RoomEnvironment":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/environments/RoomEnvironment.js"}}</script>
<script type="module">
import * as THREE from 'three';
import {RoomEnvironment} from 'RoomEnvironment';
const canvas=document.querySelector('#scene');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.6));renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;
renderer.setClearColor(0x000000,1);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x000000);
const pmrem=new THREE.PMREMGenerator(renderer);
const env=pmrem.fromScene(new RoomEnvironment(),.04);scene.environment=env.texture;
scene.add(new THREE.HemisphereLight(0xe6eff5,0x3a3530,1.0));
const key=new THREE.DirectionalLight(0xffe8c9,3.4);key.position.set(-4,6,5);scene.add(key);
const fill=new THREE.DirectionalLight(0xa9c9e2,1.5);fill.position.set(5,1,-4);scene.add(fill);
const rim=new THREE.DirectionalLight(0xffffff,1.0);rim.position.set(1,4,4);scene.add(rim);
const lowRim=new THREE.DirectionalLight(0x8fa8b8,.48);lowRim.position.set(-3,-2,-2);scene.add(lowRim);
const camera=new THREE.PerspectiveCamera(34,1,.1,100);
let yaw=28*Math.PI/180,pitch=12*Math.PI/180,drag=null,currentSeed=1,currentName='PEBBLE',specimenNo=0,rock=null,center=new THREE.Vector3(),distance=4.4;
const clock=new THREE.Clock();
const palettes=[
 {name:'RIVER PEBBLE',base:[111,119,119],rough:.82},
 {name:'MOSS BOULDER',base:[91,96,79],rough:.94},
 {name:'SANDSTONE',base:[166,139,105],rough:.93},
 {name:'GRANITE',base:[111,113,111],rough:.86},
 {name:'LIMESTONE',base:[171,166,148],rough:.9},
 {name:'DARK BASALT',base:[63,70,73],rough:.88},
 {name:'QUARTZITE',base:[157,163,161],rough:.78},
 {name:'IRONSTONE',base:[117,91,75],rough:.91}
];
function rng(seed){let a=seed>>>0;return()=>{a+=0x6D2B79F5;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};}
function hash(x,y,z){const n=Math.sin(x*127.1+y*311.7+z*74.7)*43758.5453;return n-Math.floor(n);}
function noise(x,y,z){const X=Math.floor(x),Y=Math.floor(y),Z=Math.floor(z),u=x-X,v=y-Y,w=z-Z;const s=t=>t*t*(3-2*t);const U=s(u),V=s(v),W=s(w);const a=hash(X,Y,Z),b=hash(X+1,Y,Z),c=hash(X,Y+1,Z),d=hash(X+1,Y+1,Z),e=hash(X,Y,Z+1),f=hash(X+1,Y,Z+1),g=hash(X,Y+1,Z+1),h=hash(X+1,Y+1,Z+1);return THREE.MathUtils.lerp(THREE.MathUtils.lerp(THREE.MathUtils.lerp(a,b,U),THREE.MathUtils.lerp(c,d,U),V),THREE.MathUtils.lerp(THREE.MathUtils.lerp(e,f,U),THREE.MathUtils.lerp(g,h,U),V),W);}
function fbm(x,y,z){return noise(x,y,z)*.55+noise(x*2.1+7,y*2.1,z*2.1)*.27+noise(x*4.2,y*4.2,z*4.2)*.13+noise(x*8.4,y*8.4,z*8.4)*.05;}
function makeMaps(seed,pal){
 const size=512,rand=rng(seed^0x3a71);
 const color=document.createElement('canvas'),bump=document.createElement('canvas'),rough=document.createElement('canvas');
 color.width=color.height=bump.width=bump.height=rough.width=rough.height=size;
 const c=color.getContext('2d'),b=bump.getContext('2d'),r=rough.getContext('2d');
 const im=c.createImageData(size,size),bi=b.createImageData(size,size),ri=r.createImageData(size,size);
 const warmth=pal.name==='SANDSTONE'||pal.name==='IRONSTONE';
 const layered=pal.name==='SANDSTONE'||pal.name==='LIMESTONE';
 for(let y=0;y<size;y++)for(let x=0;x<size;x++){
  const u=x/size,v=y/size;
  const broad=fbm(u*7+seed*.0001,v*7+3,seed*.0002);
  const mid=fbm(u*27+13,v*27+5,seed*.001);
  const grain=fbm(u*92+4,v*92+19,seed*.002);
  const fleck=hash(Math.floor(x/2),Math.floor(y/2),seed%997);
  const band=layered?Math.sin(v*27+Math.sin(u*8+seed*.00001)*1.5)*3.8:Math.sin(v*11+u*4)*.9;
  const mineral=Math.pow(Math.max(0,fleck-.88),2)*170;
  const pore=(hash(Math.floor(x/3),Math.floor(y/3),seed%431)>.982)?-19:0;
  const micro=(rand()-.5)*8;
  const value=(broad-.5)*30+(mid-.5)*21+(grain-.5)*12+band+mineral+pore+micro;
  const i=(y*size+x)*4;
  const tint=warmth?1:0;
  im.data[i]=THREE.MathUtils.clamp(pal.base[0]+value+mineral*.16,0,255);
  im.data[i+1]=THREE.MathUtils.clamp(pal.base[1]+value+(fleck>.94?2:0),0,255);
  im.data[i+2]=THREE.MathUtils.clamp(pal.base[2]+value+(tint? -mineral*.08:0),0,255);im.data[i+3]=255;
  const relief=fbm(u*66+3,v*66+8,seed*.001);
  const pit=hash(Math.floor(x/2),Math.floor(y/2),seed%173)>.986?-.17:0;
  const height=THREE.MathUtils.clamp(128+(relief-.5)*118+(grain-.5)*40+pit*255+(rand()-.5)*18,0,255);
  bi.data[i]=bi.data[i+1]=bi.data[i+2]=height;bi.data[i+3]=255;
  const roughness=THREE.MathUtils.clamp((pal.rough*255)+(mid-.5)*45+(fleck>.94?18:0)+(pit<0?-22:0),0,255);
  ri.data[i]=ri.data[i+1]=ri.data[i+2]=roughness;ri.data[i+3]=255;
 }
 c.putImageData(im,0,0);b.putImageData(bi,0,0);r.putImageData(ri,0,0);
 // Fine mineral seams: subtle, broken and irregular rather than decorative stripes.
 const seamRand=rng(seed^0x51a7);
 for(let k=0;k<(layered?15:9);k++){
  const x=seamRand()*size,y=seamRand()*size;
  const length=18+seamRand()*(layered?150:72);
  const bend=(seamRand()-.5)*22;
  c.beginPath();b.beginPath();
  c.moveTo(x,y);b.moveTo(x,y);
  c.quadraticCurveTo(x+length*.48,y+bend,x+length,y+(seamRand()-.5)*9);
  b.quadraticCurveTo(x+length*.48,y+bend,x+length,y);
  c.strokeStyle=layered?'rgba(42,37,30,.10)':'rgba(28,34,37,.075)';
  c.lineWidth=layered?1.5:.8;c.stroke();
  b.strokeStyle='rgba(35,35,35,.12)';b.lineWidth=1.2;b.stroke();
 }
 const map=new THREE.CanvasTexture(color),bumpMap=new THREE.CanvasTexture(bump),roughnessMap=new THREE.CanvasTexture(rough);
 map.colorSpace=THREE.SRGBColorSpace;
 for(const tex of [map,bumpMap,roughnessMap]){tex.wrapS=tex.wrapT=THREE.RepeatWrapping;tex.anisotropy=8;}
 return {map,bumpMap,roughnessMap};
}
function makeGeometry(seed,type){
 const rand=rng(seed),geo=new THREE.SphereGeometry(1,144,112),p=geo.attributes.position;
 const phase=[rand()*30,rand()*30,rand()*30];
 const profiles={
  pebble:{scale:[1.3,.76,1],power:.72,rough:.055,scar:3},
  boulder:{scale:[1.12,.96,1.08],power:1.08,rough:.075,scar:7},
  slab:{scale:[1.2,.58,1.08],power:1.02,rough:.06,scar:5},
  shard:{scale:[.91,1.2,.83],power:.92,rough:.075,scar:8},
  flint:{scale:[1.02,.92,.9],power:1.12,rough:.065,scar:7},
  porous:{scale:[1.04,.94,1],power:.98,rough:.10,scar:9},
  conglomerate:{scale:[1.08,.92,1.02],power:1.02,rough:.085,scar:6},
  fractured:{scale:[1.02,1.03,.96],power:1.08,rough:.08,scar:8},
  elongated:{scale:[.78,1.28,.82],power:.74,rough:.065,scar:7},
  block:{scale:[1.05,.94,1.02],power:1.16,rough:.075,scar:7},
  egg:{scale:[.94,1.18,.91],power:.82,rough:.045,scar:4},
  disk:{scale:[1.2,.34,1.12],power:.9,rough:.055,scar:5},
  angular:{scale:[1.02,.98,1.04],power:1.10,rough:.08,scar:8},
  weathered:{scale:[1.1,.88,1],power:1.02,rough:.09,scar:9},
  layered:{scale:[1.16,.78,1.02],power:1.04,rough:.065,scar:6}
 };
 const cfg=profiles[type]||profiles.weathered;
 const scars=Array.from({length:cfg.scar},()=>{const d=new THREE.Vector3(rand()*2-1,rand()*2-1,rand()*2-1).normalize();return{d,limit:.84+rand()*.13,depth:.012+rand()*.045,soft:.045+rand()*.09};});
 const pits=Array.from({length:type==='porous'?54:type==='weathered'?28:12},()=>{const d=new THREE.Vector3(rand()*2-1,rand()*2-1,rand()*2-1).normalize();return{d,r:.015+rand()*(type==='porous'?.052:.032),depth:.008+rand()*(type==='porous'?.045:.025)};});
 const chips=Array.from({length:type==='shard'||type==='flint'||type==='fractured'||type==='angular'?5:2},()=>{const d=new THREE.Vector3(rand()*2-1,rand()*2-1,rand()*2-1).normalize();return{d,cut:.86+rand()*.12,depth:.012+rand()*.035};});
 for(let i=0;i<p.count;i++){
  const v=new THREE.Vector3(p.getX(i),p.getY(i),p.getZ(i));
  const n=fbm(v.x*3.1+phase[0],v.y*3.1+phase[1],v.z*3.1+phase[2]);
  const detail=fbm(v.x*9+phase[1],v.y*9+phase[2],v.z*9+phase[0]);
  const fine=fbm(v.x*22+phase[2],v.y*22+phase[0],v.z*22+phase[1]);
  let radius=1+(n-.5)*cfg.rough*2+(detail-.5)*cfg.rough*.72+(fine-.5)*.018;
  if(type==='porous') radius+=(fbm(v.x*17+4,v.y*17+8,v.z*17+2)-.5)*.075;
  if(type==='conglomerate') radius+=(Math.max(0,Math.sin(v.x*8+phase[0])*Math.sin(v.y*7+phase[1])*Math.sin(v.z*9+phase[2]))-.55)*.045;
  if(type==='layered'||type==='slab') radius+=Math.sin(v.y*17+noise(v.x*4+phase[0],v.z*4+phase[1],v.y*2)*2.5)*.025;
  if(type==='flint') radius+=(Math.abs(Math.sin(v.x*5+phase[0])*Math.sin(v.y*6+phase[1])*Math.sin(v.z*5+phase[2]))-.3)*.025;
  for(const scar of scars){const facing=v.dot(scar.d);if(facing>scar.limit){const t=THREE.MathUtils.smoothstep(facing,scar.limit,Math.min(.999,scar.limit+scar.soft));radius-=scar.depth*t;}}
  for(const pit of pits){const d=v.distanceTo(pit.d);if(d<pit.r){const t=1-d/pit.r;radius-=pit.depth*t*t;}}
  for(const chip of chips){const facing=v.dot(chip.d);if(facing>chip.cut)radius-=chip.depth*THREE.MathUtils.smoothstep(facing,chip.cut,Math.min(1,chip.cut+.035));}
  v.multiplyScalar(radius);
  const pow=cfg.power;
  v.set(Math.sign(v.x)*Math.pow(Math.abs(v.x),pow)*cfg.scale[0],Math.sign(v.y)*Math.pow(Math.abs(v.y),pow)*cfg.scale[1],Math.sign(v.z)*Math.pow(Math.abs(v.z),pow)*cfg.scale[2]);
  if(type==='pebble'||type==='egg'){v.x+=.055*Math.sin(v.z*3+phase[0]);v.z+=.045*Math.cos(v.y*3+phase[2]);}
  if(type==='boulder'||type==='block'){v.x+=.055*Math.sin(v.z*4+phase[0]);v.z+=.045*Math.cos(v.x*3+phase[2]);}
  if(type==='shard'||type==='flint'){const taper=1-.24*Math.max(0,v.y);v.x*=taper;v.z*=taper;v.x+=.035*Math.sin(v.y*8+phase[1]);}
  if(type==='slab'||type==='disk'){v.y+=.035*Math.sin(v.x*5+phase[0])*Math.sin(v.z*4+phase[1]);}
  if(type==='elongated'){v.x+=.075*Math.sin(v.y*3+phase[0]);v.z+=.05*Math.cos(v.y*4+phase[1]);}
  if(type==='fractured'||type==='angular'){v.x+=.035*Math.sin(v.y*11+phase[0]);v.z+=.03*Math.cos(v.x*10+phase[1]);}
  if(type==='weathered'){v.x+=.045*Math.sin(v.z*5+phase[0]);v.y+=.035*Math.cos(v.x*4+phase[1]);}
  p.setXYZ(i,v.x,v.y,v.z);
 }
 geo.computeVertexNormals();
 return geo;
}
function build(seed){
 if(rock){scene.remove(rock);rock.geometry.dispose();rock.material.map?.dispose();rock.material.bumpMap?.dispose();rock.material.roughnessMap?.dispose();rock.material.dispose();}
 currentSeed=seed;const rand=rng(seed),pal=palettes[Math.floor(rand()*palettes.length)];
 const forms=['pebble','boulder','slab','shard','flint','porous','conglomerate','fractured','elongated','block','egg','disk','angular','weathered','layered'];
 const type=forms[Math.floor(rand()*forms.length)];
 const formNames={pebble:'ROUNDED',boulder:'BATTERED',slab:'FLAT-BROKEN',shard:'FRAGMENT',flint:'FLINT-LIKE',porous:'PITTED',conglomerate:'CONGLOMERATE',fractured:'FRACTURED',elongated:'ELONGATED',block:'BLOCKY',egg:'OVAL',disk:'DISC',angular:'ANGULAR',weathered:'WEATHERED',layered:'LAYERED'};
 currentName=pal.name;
 const maps=makeMaps(seed,pal);
 const material=new THREE.MeshStandardMaterial({map:maps.map,bumpMap:maps.bumpMap,bumpScale:.052,roughness:pal.rough,roughnessMap:maps.roughnessMap,metalness:0,envMapIntensity:.48,vertexColors:false});
 rock=new THREE.Mesh(makeGeometry(seed,type),material);rock.castShadow=false;rock.receiveShadow=false;
 rock.scale.setScalar(type==='pebble'?1.02:type==='sandstone'?.98:type==='limestone'?.96:type==='ironstone'?.95:.94);rock.position.y=0;scene.add(rock);
 const box=new THREE.Box3().setFromObject(rock),sphere=box.getBoundingSphere(new THREE.Sphere());center.copy(sphere.center);
 distance=sphere.radius/Math.sin(THREE.MathUtils.degToRad(camera.fov/2))*1.48;
 document.querySelector('#readout').innerHTML='SPECIMEN '+String(specimenNo).padStart(3,'0')+'<br>'+formNames[type]+' · '+pal.name;
}
function next(){specimenNo++;build((Math.random()*0xffffffff)>>>0);}next();
canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;yaw+=dx*.008;pitch=THREE.MathUtils.clamp(pitch+dy*.006,-1.15,1.15);});
canvas.addEventListener('pointerup',()=>drag=null);canvas.addEventListener('pointercancel',()=>drag=null);
document.querySelector('#generate').addEventListener('click',()=>{const view=document.querySelector('.view');view.classList.remove('earthquake');void view.offsetWidth;view.classList.add('earthquake');next();});
const storeKey='stone-study-favorites-v1';const readSaved=()=>{try{return JSON.parse(localStorage.getItem(storeKey)||'[]');}catch{return[];}};
document.querySelector('#save').addEventListener('click',()=>{const a=readSaved();if(a.some(x=>x.seed===currentSeed))return; a.unshift({seed:currentSeed,name:currentName,no:specimenNo,thumb:renderer.domElement.toDataURL('image/jpeg',.78)});localStorage.setItem(storeKey,JSON.stringify(a.slice(0,60)));document.querySelector('#save').textContent='SAVED ✓';setTimeout(()=>document.querySelector('#save').textContent='SAVE SPECIMEN +',1100);});
const gallery=document.querySelector('#gallery'),items=document.querySelector('#items');
function showGallery(){const a=readSaved();items.innerHTML='';if(!a.length)items.innerHTML='<div class="empty">NO SAVED SPECIMENS YET.</div>';a.forEach(item=>{const card=document.createElement('div');card.className='card';const img=document.createElement('img');img.className='thumb';img.src=item.thumb;const info=document.createElement('div');info.className='cardInfo';info.textContent=String(item.no).padStart(3,'0');card.append(img,info);card.onclick=()=>{specimenNo=item.no;build(item.seed);gallery.style.display='none';};items.append(card);});gallery.style.display='flex';}
document.querySelector('#collection').onclick=showGallery;document.querySelector('#closeGallery').onclick=()=>gallery.style.display='none';
function resize(){const r=canvas.getBoundingClientRect();if(!r.width||!r.height)return;renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix();if(rock){const box=new THREE.Box3().setFromObject(rock),s=box.getBoundingSphere(new THREE.Sphere());distance=s.radius/Math.sin(THREE.MathUtils.degToRad(camera.fov/2))*1.48;}}
new ResizeObserver(resize).observe(canvas);window.addEventListener('resize',resize);resize();
function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.05);if(rock){rock.rotation.y+=dt*.105;rock.rotation.x+=dt*.027+Math.sin(clock.elapsedTime*.22)*dt*.012;rock.rotation.z+=dt*.018+Math.cos(clock.elapsedTime*.17)*dt*.009;}camera.position.set(center.x+Math.sin(yaw)*Math.cos(pitch)*distance,center.y+Math.sin(pitch)*distance,center.z+Math.cos(yaw)*Math.cos(pitch)*distance);camera.lookAt(center);renderer.render(scene,camera);}frame();
</script></body></html>
